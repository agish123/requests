name: CI/CD Pipeline for Requests Library

on:
  push:
    branches: [ main, fix-* ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest requests flask locust

      # Step 4: Run the Requests test suite
      - name: Run test suite
        run: |
          pytest tests/ --junitxml=test-results.xml
        continue-on-error: true

      # Step 5: Run manual_test.py
      - name: Run manual tests
        run: |
          python manual_test.py
        continue-on-error: true

      # Step 6: Start the Flask app in the background
      - name: Start Flask app
        run: |
          nohup python app.py &
          sleep 5  # Wait for the Flask app to start

      # Step 7: Run performance tests with Locust
      - name: Run performance tests
        run: |
          locust -f performance_tests/locustfile.py --headless -u 1000 -r 100 -t 5m --host http://localhost:5000 --csv performance_tests/load_test
        continue-on-error: true

      # Step 8: Upload test results and performance metrics
      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: test-results.xml

      - name: Upload performance metrics
        uses: actions/upload-artifact@v3
        with:
          name: performance-metrics
          path: performance_tests/load_test_*.csv

      # Step 9: Check bug resolution
      - name: Check bug resolution
        run: |
          # Check Bug #1 (InsecureRequestWarning)
          if grep -q "urllib3.disable_warnings" manual_test.py; then
            echo "Bug #1 (InsecureRequestWarning) fix is present in manual_test.py"
          else
            echo "Bug #1 fix not found in manual_test.py" && exit 1
          fi

          # Check Bug #2 (Excessive Redirects)
          if grep -q "Redirect Error" manual_test.py; then
            echo "Bug #2 (Excessive Redirects) test is present in manual_test.py"
          else
            echo "Bug #2 test not found in manual_test.py" && exit 1
          fi

          # Check Bug #3 (ReadTimeout)
          if grep -q "Timeout Error" manual_test.py; then
            echo "Bug #3 (ReadTimeout) test is present in manual_test.py"
          else
            echo "Bug #3 test not found in manual_test.py" && exit 1
          fi

      # Step 10: Comment on PR with test and performance results
      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const testResults = fs.existsSync('test-results.xml') ? 'Test suite ran successfully. See artifacts for details.' : 'Test suite failed.';
            const performanceResults = fs.existsSync('performance_tests/load_test_stats.csv') ? 'Performance test ran successfully. See artifacts for metrics.' : 'Performance test failed.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**CI/CD Results**\n\n- **Test Suite**: ${testResults}\n- **Performance Test**: ${performanceResults}\n\nCheck the artifacts for detailed results.`
            });